spring.application.name=demo

# 百炼 DashScope（OpenAI 兼容接口）
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.model=qwen-plus
llm.vision-model=qwen-vl-plus

# 百炼语音合成 TTS（业务空间专属域名；workspace-id 在百炼控制台「业务空间」页查看，音色必须带版本号）
llm.workspace-id=你的百炼WorkspaceId
llm.tts-model=qwen-audio-3.0-tts-flash
llm.tts-voice=longanhuan_v3.6

# 和风天气（https://console.qweather.com 控制台「项目管理」里查看专属 API Host）
weather.api-host=你的专属APIHost（形如xxx.re.qweatherapi.com）
weather.api-key=你的和风天气APIKey
weather.default-city=扬州

# 把下面这行换成你的真实 Key，另存为 application.properties（该文件已被 .gitignore 忽略）
llm.api-key=请替换成你的百炼APIKey
